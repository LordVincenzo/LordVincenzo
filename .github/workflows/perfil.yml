name: Actualizar perfil

# Por ahora solo se lanza a mano (pestaña Actions > Actualizar perfil > Run workflow):
# GitHub no está ejecutando Actions en esta cuenta por un bloqueo de facturación.
# Cuando se resuelva, quitar los "#" de las líneas de schedule para que corra cada día.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 11 * * *"   # todos los días, 6:17 a. m. hora Colombia

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar imágenes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || (git commit -m "Actualiza la actividad del perfil" && git push)
