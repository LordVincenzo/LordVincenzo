<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813 362" width="813" height="362" role="img" aria-label="About me: technologist in Software Analysis and Development. I build web and mobile apps end to end and automate processes. I manage the Prizma learning platform at Corporación Universitaria Americana, where I automated course loading with n8n. I&#x27;m into AI that runs locally, real-time apps and automation workflows."><defs><clipPath id="clip"><rect width="802" height="340" rx="16"/></clipPath></defs><style>.b{animation:b 4s ease-in-out infinite;transform-origin:48px 0}@keyframes b{50%{transform:scaleX(4)}}.viaje{animation:viaje 9s linear infinite}@keyframes viaje{to{stroke-dashoffset:-1000}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(0,0)"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171717"/><stop offset="1" stop-color="#090909"/></linearGradient><radialGradient id="tl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity="0.075"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="tb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient><pattern id="malla" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".16"/></pattern><linearGradient id="tf" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="tm"><rect width="802" height="340" fill="url(#tf)"/></mask></defs><g clip-path="url(#clip)"><rect width="802" height="340" fill="url(#tg)"/><rect width="802" height="340" fill="url(#malla)" mask="url(#tm)"/><rect width="802" height="340" fill="url(#tl)"/></g><rect x="1" y="1" width="800" height="338" rx="15" fill="none" stroke="url(#tb)" stroke-width="1.5"/><rect class="viaje" x="1" y="1" width="800" height="338" rx="15" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="1.6" stroke-linecap="round" pathLength="1000" stroke-dasharray="46 954"/><path d="M14 26 V14 H26 M788 26 V14 H776 M14 314 V326 H26 M788 314 V326 H776 " fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/><rect x="48" y="51" width="11" height="11" fill="#ffffff"/><text x="70" y="62" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" letter-spacing="3.5" fill="#ffffff">ABOUT ME</text><rect class="b" x="48" y="78" width="60" height="3" fill="#ffffff"/><text x="48" y="116" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a3a3a3">Technologist in <tspan fill="#ffffff" font-weight="700">Software Analysis and Development</tspan>. I build web</text><text x="48" y="145" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a3a3a3">and mobile apps end to end, and I automate processes so the</text><text x="48" y="174" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a3a3a3">repetitive work is done by the system.</text><text x="48" y="219" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a3a3a3">Today I manage the <tspan fill="#ffffff" font-weight="700">Prizma</tspan> learning platform at Corporación</text><text x="48" y="248" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a3a3a3">Universitaria Americana, where I automated course loading with <tspan fill="#ffffff" font-weight="700">n8n</tspan>.</text><text x="48" y="293" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a3a3a3">I&#x27;m into <tspan fill="#ffffff" font-weight="700">AI that runs locally</tspan>, <tspan fill="#ffffff" font-weight="700">real-time apps</tspan></text><text x="48" y="322" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a3a3a3">and <tspan fill="#ffffff" font-weight="700">automation workflows</tspan>.</text></g></svg>