<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Pixel-art robot coding on a laptop. Soledad, Colombia."><defs><clipPath id="clip"><rect width="400" height="400" rx="16"/></clipPath></defs><style>.bot{animation:bot 3s ease-in-out infinite}@keyframes bot{50%{transform:translate(56px,38px)}}.sombra{animation:so 3s ease-in-out infinite;transform-origin:200px 344px}@keyframes so{50%{transform:scaleX(.9)}}.ojos{animation:oj 4.6s infinite;transform-box:fill-box;transform-origin:center}@keyframes oj{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}.luz{animation:lz 1.2s steps(1) infinite}@keyframes lz{50%{opacity:.25}}.bi{animation:br .36s steps(1) infinite}.bd{animation:br .36s steps(1) infinite;animation-delay:.18s}@keyframes br{50%{transform:translateY(-9px)}}.s{animation:s 5s ease-in-out infinite;opacity:0}.s1{animation-delay:1.2s}.s2{animation-delay:2.4s}.s3{animation-delay:3.6s}@keyframes s{0%{opacity:0;transform:translateY(14px)}25%,60%{opacity:.9}100%{opacity:0;transform:translateY(-22px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="400" height="400" rx="16" fill="#ff2d3d"/><text class="s s0" x="26" y="118" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="26" font-weight="700" fill="#050505">{ }</text><text class="s s1" x="318" y="96" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#ffffff">&lt;/&gt;</text><text class="s s2" x="40" y="232" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#ffffff">=&gt;</text><text class="s s3" x="326" y="214" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#050505">01</text>
