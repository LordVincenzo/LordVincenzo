<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="¿Automatizamos algo juntos? Escríbeme."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1c"/><stop offset="1" stop-color="#101936"/></linearGradient><radialGradient id="glow" cx="0.9" cy="0.5" r=".75"><stop offset="0" stop-color="#5eead4" stop-opacity=".17"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient><clipPath id="clip"><rect x="1" y="1" width="1198" height="168" rx="22"/></clipPath><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#7f93c9" fill-opacity=".22"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#fff"/></linearGradient><mask id="mk"><rect width="1200" height="170" fill="url(#fade)"/></mask><linearGradient id="cta" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><style>.ola{fill:none;stroke:#5eead4;stroke-opacity:.35;stroke-width:1.6;stroke-dasharray:6 10;animation:ola 2.2s linear infinite}@keyframes ola{to{stroke-dashoffset:-32}}.fl{animation:fl 1.6s ease-in-out infinite}@keyframes fl{50%{transform:translateX(6px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="1200" height="170" fill="url(#bg)"/><rect width="1200" height="170" fill="url(#dots)" mask="url(#mk)"/><rect width="1200" height="170" fill="url(#glow)"/></g><rect x="1" y="1" width="1198" height="168" rx="22" fill="none" stroke="#22305a" stroke-width="1.5"/><g clip-path="url(#clip)"><path class="ola" d="M0 150 Q60 132 120 150 Q180 168 240 150 Q300 132 360 150 Q420 168 480 150 Q540 132 600 150 Q660 168 720 150 Q780 132 840 150 Q900 168 960 150 Q1020 132 1080 150 Q1140 168 1200 150"/></g>
