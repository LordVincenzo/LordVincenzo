<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Flujo de automatización animado. Soledad, Colombia."><defs><clipPath id="clip"><rect width="400" height="400" rx="16"/></clipPath></defs><style>.w{fill:none;stroke:#050505;stroke-width:2.2;stroke-dasharray:5 7;animation:f 1.3s linear infinite}@keyframes f{to{stroke-dashoffset:-24}}.n{animation:n 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.n1{animation-delay:.55s}.n2{animation-delay:1.1s}.n3{animation-delay:1.65s}@keyframes n{0%,14%,100%{transform:scale(1)}7%{transform:scale(1.13)}}.c{animation:c 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes c{50%{transform:rotate(45deg) scale(.7)}}.r{animation:r 40s linear infinite;transform-origin:200px 200px}@keyframes r{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="400" height="400" rx="16" fill="#ff2d3d"/>
