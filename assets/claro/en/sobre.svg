<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 807 304" width="807" height="304" role="img" aria-label="About me: technologist in Software Analysis and Development. I build web and mobile apps end to end and automate processes. I manage the Prizma learning platform at Corporación Universitaria Americana, where I automated course loading with n8n. I&#x27;m into AI that runs locally, real-time apps and automation workflows."><defs><clipPath id="clip"><rect width="807" height="304" rx="16"/></clipPath></defs><style>.b{animation:b 4s ease-in-out infinite;transform-origin:40px 0}@keyframes b{50%{transform:scaleX(4)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="807" height="304" fill="#f3f3f3"/></g><rect x="1" y="1" width="805" height="302" rx="15" fill="none" stroke="#d6d6d6" stroke-width="1.5"/><rect x="40" y="41" width="11" height="11" fill="#0a0a0a"/><text x="62" y="52" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" letter-spacing="3.5" fill="#0a0a0a">ABOUT ME</text><rect class="b" x="40" y="66" width="60" height="3" fill="#0a0a0a"/><text x="40" y="96" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Technologist in <tspan fill="#0a0a0a" font-weight="700">Software Analysis and Development</tspan>. I build web</text><text x="40" y="124" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">and mobile apps end to end, and I automate processes so the</text><text x="40" y="152" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">repetitive work is done by the system.</text><text x="40" y="194" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Today I manage the <tspan fill="#0a0a0a" font-weight="700">Prizma</tspan> learning platform at Corporación</text><text x="40" y="222" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Universitaria Americana, where I automated course loading with <tspan fill="#0a0a0a" font-weight="700">n8n</tspan>.</text><text x="40" y="264" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">I&#x27;m into <tspan fill="#0a0a0a" font-weight="700">AI that runs locally</tspan>, <tspan fill="#0a0a0a" font-weight="700">real-time apps</tspan></text><text x="40" y="292" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">and <tspan fill="#0a0a0a" font-weight="700">automation workflows</tspan>.</text></svg>