<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813 362" width="813" height="362" role="img" aria-label="About me: technologist in Software Analysis and Development. I build web and mobile apps end to end and automate processes. I manage the Prizma learning platform at Corporación Universitaria Americana, where I automated course loading with n8n. I&#x27;m into AI that runs locally, real-time apps and automation workflows."><defs><clipPath id="clip"><rect width="802" height="340" rx="16"/></clipPath></defs><style>.b{animation:b 4s ease-in-out infinite;transform-origin:48px 0}@keyframes b{50%{transform:scaleX(4)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(0,0)"><g clip-path="url(#clip)"><rect width="802" height="340" fill="#f3f3f3"/></g><rect x="1" y="1" width="800" height="338" rx="15" fill="none" stroke="#d6d6d6" stroke-width="1.5"/><rect x="48" y="51" width="11" height="11" fill="#0a0a0a"/><text x="70" y="62" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" letter-spacing="3.5" fill="#0a0a0a">ABOUT ME</text><rect class="b" x="48" y="78" width="60" height="3" fill="#0a0a0a"/><text x="48" y="116" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Technologist in <tspan fill="#0a0a0a" font-weight="700">Software Analysis and Development</tspan>. I build web</text><text x="48" y="145" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">and mobile apps end to end, and I automate processes so the</text><text x="48" y="174" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">repetitive work is done by the system.</text><text x="48" y="219" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Today I manage the <tspan fill="#0a0a0a" font-weight="700">Prizma</tspan> learning platform at Corporación</text><text x="48" y="248" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Universitaria Americana, where I automated course loading with <tspan fill="#0a0a0a" font-weight="700">n8n</tspan>.</text><text x="48" y="293" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">I&#x27;m into <tspan fill="#0a0a0a" font-weight="700">AI that runs locally</tspan>, <tspan fill="#0a0a0a" font-weight="700">real-time apps</tspan></text><text x="48" y="322" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">and <tspan fill="#0a0a0a" font-weight="700">automation workflows</tspan>.</text></g></svg>