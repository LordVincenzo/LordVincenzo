<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 807 304" width="807" height="304" role="img" aria-label="Sobre mí: tecnólogo en Análisis y Desarrollo de Software. Construyo aplicaciones web y móviles de punta a punta y automatizo procesos. Gestiono la plataforma educativa Prizma en la Corporación Universitaria Americana, donde automaticé el cargue de cursos con n8n. Me interesan la IA que corre en local, las apps en tiempo real y los flujos de automatización."><defs><clipPath id="clip"><rect width="807" height="304" rx="16"/></clipPath></defs><style>.b{animation:b 4s ease-in-out infinite;transform-origin:40px 0}@keyframes b{50%{transform:scaleX(4)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#clip)"><rect width="807" height="304" fill="#f3f3f3"/></g><rect x="1" y="1" width="805" height="302" rx="15" fill="none" stroke="#d6d6d6" stroke-width="1.5"/><rect x="40" y="41" width="11" height="11" fill="#0a0a0a"/><text x="62" y="52" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" letter-spacing="3.5" fill="#0a0a0a">SOBRE MÍ</text><rect class="b" x="40" y="66" width="60" height="3" fill="#0a0a0a"/><text x="40" y="96" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Tecnólogo en <tspan fill="#0a0a0a" font-weight="700">Análisis y Desarrollo de Software</tspan>. Construyo aplicaciones</text><text x="40" y="124" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">web y móviles de punta a punta, y automatizo procesos para que el</text><text x="40" y="152" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">trabajo repetitivo lo haga el sistema.</text><text x="40" y="194" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Hoy gestiono la plataforma educativa <tspan fill="#0a0a0a" font-weight="700">Prizma</tspan> en la Corporación</text><text x="40" y="222" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Universitaria Americana, donde automaticé el cargue de cursos con <tspan fill="#0a0a0a" font-weight="700">n8n</tspan>.</text><text x="40" y="264" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Me interesan la <tspan fill="#0a0a0a" font-weight="700">IA que corre en local</tspan>, las <tspan fill="#0a0a0a" font-weight="700">apps en tiempo real</tspan></text><text x="40" y="292" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">y los <tspan fill="#0a0a0a" font-weight="700">flujos de automatización</tspan>.</text></svg>