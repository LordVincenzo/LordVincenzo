<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813 362" width="813" height="362" role="img" aria-label="Sobre mí: tecnólogo en Análisis y Desarrollo de Software. Construyo aplicaciones web y móviles de punta a punta y automatizo procesos. Gestiono la plataforma educativa Prizma en la Corporación Universitaria Americana, donde automaticé el cargue de cursos con n8n. Me interesan la IA que corre en local, las apps en tiempo real y los flujos de automatización."><defs><clipPath id="clip"><rect width="802" height="340" rx="16"/></clipPath></defs><style>.b{animation:b 4s ease-in-out infinite;transform-origin:48px 0}@keyframes b{50%{transform:scaleX(4)}}.viaje{animation:viaje 9s linear infinite}@keyframes viaje{to{stroke-dashoffset:-1000}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(0,0)"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ececec"/></linearGradient><radialGradient id="tl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity="0.0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="tb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505" stop-opacity=".5"/><stop offset=".5" stop-color="#050505" stop-opacity=".14"/><stop offset="1" stop-color="#050505" stop-opacity=".06"/></linearGradient><pattern id="malla" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#050505" fill-opacity=".16"/></pattern><linearGradient id="tf" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="tm"><rect width="802" height="340" fill="url(#tf)"/></mask></defs><g clip-path="url(#clip)"><rect width="802" height="340" fill="url(#tg)"/><rect width="802" height="340" fill="url(#malla)" mask="url(#tm)"/><rect width="802" height="340" fill="url(#tl)"/></g><rect x="1" y="1" width="800" height="338" rx="15" fill="none" stroke="url(#tb)" stroke-width="1.5"/><rect class="viaje" x="1" y="1" width="800" height="338" rx="15" fill="none" stroke="#050505" stroke-opacity=".9" stroke-width="1.6" stroke-linecap="round" pathLength="1000" stroke-dasharray="46 954"/><path d="M14 26 V14 H26 M788 26 V14 H776 M14 314 V326 H26 M788 314 V326 H776 " fill="none" stroke="#050505" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/><rect x="48" y="51" width="11" height="11" fill="#0a0a0a"/><text x="70" y="62" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" letter-spacing="3.5" fill="#0a0a0a">SOBRE MÍ</text><rect class="b" x="48" y="78" width="60" height="3" fill="#0a0a0a"/><text x="48" y="116" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Tecnólogo en <tspan fill="#0a0a0a" font-weight="700">Análisis y Desarrollo de Software</tspan>. Construyo aplicaciones</text><text x="48" y="145" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">web y móviles de punta a punta, y automatizo procesos para que el</text><text x="48" y="174" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">trabajo repetitivo lo haga el sistema.</text><text x="48" y="219" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Hoy gestiono la plataforma educativa <tspan fill="#0a0a0a" font-weight="700">Prizma</tspan> en la Corporación</text><text x="48" y="248" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Universitaria Americana, donde automaticé el cargue de cursos con <tspan fill="#0a0a0a" font-weight="700">n8n</tspan>.</text><text x="48" y="293" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">Me interesan la <tspan fill="#0a0a0a" font-weight="700">IA que corre en local</tspan>, las <tspan fill="#0a0a0a" font-weight="700">apps en tiempo real</tspan></text><text x="48" y="322" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#555555">y los <tspan fill="#0a0a0a" font-weight="700">flujos de automatización</tspan>.</text></g></svg>