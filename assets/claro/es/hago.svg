ica Neue', Arial, sans-serif" font-size="15.5" fill="#5a5a5a">de la idea a la app funcionando.</text><line x1="380" x2="380" y1="70" y2="250" stroke="#d9d9d9"/><g transform="translate(410,66)"><circle cx="40" cy="34" r="27" fill="none" stroke="#a6a6a6" stroke-width="1.3" stroke-dasharray="3 6"/><g class="gira"><circle cx="13" cy="34" r="8" fill="#0d0d0d"/><circle cx="67" cy="34" r="5" fill="#5a5a5a"/></g></g><text x="410" y="166" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="3" fill="#5a5a5a">02 — AUTOMATIZACIÓN</text><text x="410" y="200" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#0d0d0d">Que lo haga el sistema</text><text x="410" y="228" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#5a5a5a">Flujos con n8n y Power Automate</text><text x="410" y="250" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#5a5a5a">que ahorran horas de trabajo manual.</text><line x1="790" x2="790" y1="70" y2="250" stroke="#d9d9d9"/><g transform="translate(820,66)"><path d="M4 54 L26 38 L46 44 L72 12" fill="none" stroke="#a6a6a6" stroke-width="1.3"/><path d="M4 49 Q4 54 9 54 Q4 54 4 59 Q4 54 -1 54 Q4 54 4 49 Z" fill="#0d0d0d" class="tw" style="animation-delay:0.0s"/><path d="M26 32 Q26 38 32 38 Q26 38 26 44 Q26 38 20 38 Q26 38 26 32 Z" fill="#0d0d0d" class="tw" style="animation-delay:0.5s"/><path d="M46 39 Q46 44 51 44 Q46 44 46 49 Q46 44 41 44 Q46 44 46 39 Z" fill="#0d0d0d" class="tw" style="animation-delay:1.0s"/><path d="M72 3 Q72 12 81 12 Q72 12 72 21 Q72 12 63 12 Q72 12 72 3 Z" fill="#0d0d0d" class="tw" style="animation-delay:1.5s"/></g><text x="820" y="166" font-family="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="3" fill="#5a